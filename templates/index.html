        // =========================================================
        // MODULE 3: INTERACTIVE TARGET REFLEX RANGE (GAMEPLAY SIMULATOR)
        // =========================================================
        function TargetRangeView({ currentUser, showToast, onEvaluated }) {
            const [targetPos, setTargetPos] = useState({ top: 40, left: 50 });
            const [targetActive, setTargetActive] = useState(false);
            const [targetSpawnTime, setTargetSpawnTime] = useState(0);

            // Gameplay real statistics
            const [score, setScore] = useState(0);
            const [shotsFired, setShotsFired] = useState(0);
            const [hits, setHits] = useState(0);
            const [headshots, setHeadshots] = useState(0);
            const [reactionTimes, setReactionTimes] = useState([]);
            const [startTime, setStartTime] = useState(null);
            const [gameRunning, setGameRunning] = useState(false);
            const [timeLeft, setTimeLeft] = useState(30);

            // Timer countdown
            useEffect(() => {
                let interval = null;
                if (gameRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && gameRunning) {
                    setGameRunning(false);
                    setTargetActive(false);
                    showToast('Target session ended! Submit stats to test cheat detection.', 'info');
                }
                return () => clearInterval(interval);
            }, [gameRunning, timeLeft]);

            const spawnTarget = () => {
                const top = Math.floor(Math.random() * 70) + 15;
                const left = Math.floor(Math.random() * 80) + 10;
                setTargetPos({ top, left });
                setTargetSpawnTime(Date.now());
                setTargetActive(true);
            };

            const startGame = () => {
                setScore(0);
                setShotsFired(0);
                setHits(0);
                setHeadshots(0);
                setReactionTimes([]);
                setTimeLeft(30);
                setStartTime(Date.now());
                setGameRunning(true);
                spawnTarget();
            };

            const handleArenaClick = (e) => {
                if (!gameRunning) return;
                setShotsFired(prev => prev + 1);
            };

            const handleTargetClick = (e, isHeadshot) => {
                e.stopPropagation();
                if (!gameRunning || !targetActive) return;

                const reactionMs = Date.now() - targetSpawnTime;
                setReactionTimes(prev => [...prev, reactionMs]);
                setHits(prev => prev + 1);
                setScore(prev => prev + (isHeadshot ? 250 : 100));

                if (isHeadshot) {
                    setHeadshots(prev => prev + 1);
                }

                setTargetActive(false);
                setTimeout(spawnTarget, 250);
            };

            // Calculated Metrics
            const accuracyPct = shotsFired > 0 ? Math.round((hits / shotsFired) * 100) : 0;
            const headshotPct = hits > 0 ? Math.round((headshots / hits) * 100) : 0;
            const avgReaction = reactionTimes.length > 0 
                ? Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length) 
                : 240;
            const elapsedSeconds = Math.max(1, 30 - timeLeft);
            const aps = Math.round((shotsFired / elapsedSeconds) * 10) / 10;

            // Submit live telemetry to Random Forest model
            const submitTelemetry = async (overrideStats = null, profile = 'None') => {
                if (!currentUser) {
                    showToast('Please sign in before submitting telemetry.', 'warning');
                    return;
                }

                const payload = overrideStats || {
                    kills: hits,
                    deaths: Math.max(1, Math.floor(hits / 3)),
                    headshot_pct: headshotPct,
                    accuracy_pct: accuracyPct,
                    reaction_time_ms: avgReaction,
                    movement_speed: 5.5,
                    actions_per_second: aps,
                    session_duration_s: elapsedSeconds,
                    cheat_profile: profile
                };

                try {
                    const res = await fetch('/api/gameplay/submit-live', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        showToast(`Evaluated: ${data.prediction} (${data.cheat_probability}% Cheat Probability)`, data.prediction === 'Suspicious' ? 'error' : 'success');
                        onEvaluated();
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (err) {
                    showToast('Failed to evaluate telemetry', 'error');
                }
            };

            return (
                <div className="space-y-8">
                    {/* Range Header */}
                    <div className="flex flex-wrap items-center justify-between gap-4 p-6 bg-[#0f172a] rounded-3xl border border-indigo-950 shadow-xl">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-mono text-xs font-semibold">
                                    LIVE INTERACTIVE GAMEPLAY (is_simulated = 0)
                                </span>
                            </div>
                            <h2 className="text-2xl font-black text-white mt-2">Reflex Arena: Target Range</h2>
                            <p className="text-xs text-slate-400 mt-1">
                                Click the targets to record real human reaction time, crosshair accuracy, and headshot ratios.
                            </p>
                        </div>

                        {/* Presets for Testing */}
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => submitTelemetry({
                                    kills: 28, deaths: 1, headshot_pct: 92.0, accuracy_pct: 94.0,
                                    reaction_time_ms: 130.0, movement_speed: 6.0, actions_per_second: 8.0,
                                    session_duration_s: 300.0, cheat_profile: 'Aimbot'
                                }, 'Aimbot')}
                                className="px-3.5 py-2 rounded-xl bg-red-950/70 hover:bg-red-900/80 text-red-300 border border-red-500/40 text-xs font-semibold transition"
                            >
                                <i className="fa-solid fa-crosshairs mr-1.5"></i> Test Aimbot Preset
                            </button>
                            <button
                                onClick={() => submitTelemetry({
                                    kills: 24, deaths: 2, headshot_pct: 55.0, accuracy_pct: 82.0,
                                    reaction_time_ms: 55.0, movement_speed: 5.5, actions_per_second: 7.0,
                                    session_duration_s: 300.0, cheat_profile: 'Triggerbot'
                                }, 'Triggerbot')}
                                className="px-3.5 py-2 rounded-xl bg-purple-950/70 hover:bg-purple-900/80 text-purple-300 border border-purple-500/40 text-xs font-semibold transition"
                            >
                                <i className="fa-solid fa-bolt mr-1.5"></i> Test Triggerbot Preset
                            </button>
                        </div>
                    </div>

                    {/* Stats HUD */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Score</div>
                            <div className="text-2xl font-black text-indigo-400 font-mono mt-1">{score}</div>
                        </div>
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Accuracy</div>
                            <div className="text-2xl font-black text-cyan-400 font-mono mt-1">{accuracyPct}%</div>
                        </div>
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Headshot %</div>
                            <div className="text-2xl font-black text-purple-400 font-mono mt-1">{headshotPct}%</div>
                        </div>
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Avg Reaction</div>
                            <div className="text-2xl font-black text-emerald-400 font-mono mt-1">{avgReaction} <span className="text-xs">ms</span></div>
                        </div>
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Actions / Sec</div>
                            <div className="text-2xl font-black text-amber-400 font-mono mt-1">{aps}</div>
                        </div>
                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-center">
                            <div className="text-[10px] font-mono uppercase text-slate-400">Time Left</div>
                            <div className={`text-2xl font-black font-mono mt-1 ${timeLeft <= 5 ? 'text-red-400 animate-ping' : 'text-slate-200'}`}>{timeLeft}s</div>
                        </div>
                    </div>

                    {/* Interactive 2D Shooting Range Arena */}
                    <div 
                        onClick={handleArenaClick}
                        className="relative w-full h-96 bg-[#060a14] rounded-3xl border-2 border-indigo-950 overflow-hidden cursor-crosshair select-none shadow-2xl"
                    >
                        {/* Background Grid Pattern */}
                        <div className="absolute inset-0 bg-[linear-gradient(to_right,#1e1b4b15_1px,transparent_1px),linear-gradient(to_bottom,#1e1b4b15_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

                        {!gameRunning ? (
                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm z-20 p-6 text-center">
                                <div className="w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-3xl mb-4">
                                    <i className="fa-solid fa-bullseye"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white mb-2">Ready to Test Your Aim?</h3>
                                <p className="text-xs text-slate-400 max-w-md mb-6">
                                    Targets will spawn dynamically. Hit the center bullseye for headshots and faster reaction times!
                                </p>
                                <div className="flex gap-4">
                                    <button
                                        onClick={startGame}
                                        className="px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500 hover:opacity-90 text-white font-bold text-sm shadow-xl shadow-indigo-600/30 transition flex items-center gap-2"
                                    >
                                        <i className="fa-solid fa-play"></i> Start 30s Target Round
                                    </button>
                                    {shotsFired > 0 && (
                                        <button
                                            onClick={() => submitTelemetry()}
                                            className="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-xl shadow-emerald-600/30 transition flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-brain"></i> Submit Live Telemetry
                                        </button>
                                    )}
                                </div>
                            </div>
                        ) : (
                            /* Spawned Target Hitbox */
                            targetActive && (
                                <div 
                                    className="absolute target-box cursor-pointer"
                                    style={{ top: `${targetPos.top}%`, left: `${targetPos.left}%`, transform: 'translate(-50%, -50%)' }}
                                    onClick={(e) => handleTargetClick(e, false)}
                                >
                                    {/* Outer Target Circle (Body Hit) */}
                                    <div className="w-16 h-16 rounded-full bg-indigo-600/30 border-2 border-indigo-400 flex items-center justify-center shadow-[0_0_20px_#6366f1]">
                                        {/* Inner Target Circle (Headshot Zone) */}
                                        <div 
                                            className="w-7 h-7 rounded-full bg-red-500 hover:bg-red-400 border border-white flex items-center justify-center shadow-[0_0_12px_#ef4444] transition-transform hover:scale-110"
                                            onClick={(e) => handleTargetClick(e, true)}
                                            title="Headshot Zone!"
                                        >
                                            <div className="w-2 h-2 rounded-full bg-white"></div>
                                        </div>
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================
        // MODULE 5: LIVE DETECTION DASHBOARD & 4 INTERACTIVE GRAPHS
        // (Bar, Pie, Scatter, Line Charts using Chart.js)
        // Stage H & I of the Flowchart: Classifies & Visualizes
        // =========================================================
        function DetectionDashboardView({ showToast, onSwitchToModerator }) {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [filterType, setFilterType] = useState('all'); // 'all', 'legitimate', 'suspicious', 'cheating'

            // Chart Canvas Refs
            const barChartRef = useRef(null);
            const pieChartRef = useRef(null);
            const scatterChartRef = useRef(null);
            const lineChartRef = useRef(null);

            // Chart Instances
            const barInstance = useRef(null);
            const pieInstance = useRef(null);
            const scatterInstance = useRef(null);
            const lineInstance = useRef(null);

            const fetchDashboardData = async () => {
                try {
                    const res = await fetch('/api/detection/dashboard');
                    const json = await res.json();
                    if (json.status === 'success') {
                        setData(json);
                    }
                } catch (e) {
                    console.error("Dashboard fetch error:", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchDashboardData();
                const interval = setInterval(fetchDashboardData, 5000);
                return () => clearInterval(interval);
            }, []);

            // Render Chart.js graphs whenever data updates
            useEffect(() => {
                if (!data || !data.charts) return;

                // 1. Bar Chart: Player vs Cheat Probability (%)
                if (barChartRef.current) {
                    if (barInstance.current) barInstance.current.destroy();
                    const ctx = barChartRef.current.getContext('2d');
                    barInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.charts.bar.labels,
                            datasets: [{
                                label: 'Cheat Probability (%)',
                                data: data.charts.bar.probabilities,
                                backgroundColor: data.charts.bar.colors,
                                borderRadius: 8,
                                borderWidth: 1,
                                borderColor: 'rgba(255,255,255,0.1)'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    min: 0,
                                    max: 100,
                                    grid: { color: 'rgba(255,255,255,0.05)' },
                                    ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono' } }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#94a3b8' }
                                }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                }

                // 2. Doughnut / Pie Chart: 3-Tier Classification (Legitimate, Suspicious, Cheating)
                if (pieChartRef.current) {
                    if (pieInstance.current) pieInstance.current.destroy();
                    const ctx = pieChartRef.current.getContext('2d');
                    pieInstance.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: data.charts.pie.labels,
                            datasets: [{
                                data: data.charts.pie.data,
                                backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                                borderColor: '#0f172a',
                                borderWidth: 3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#f1f5f9', padding: 15, font: { family: 'Inter' } }
                                }
                            }
                        }
                    });
                }

                // 3. Scatter Plot: Accuracy (%) vs Reaction Time (ms)
                // (Isolates biological human cluster vs anomalous vs superhuman cheater cluster)
                if (scatterChartRef.current) {
                    if (scatterInstance.current) scatterInstance.current.destroy();
                    const ctx = scatterChartRef.current.getContext('2d');
                    const legitPoints = data.charts.scatter.filter(p => p.prediction === 'Legitimate');
                    const suspiciousPoints = data.charts.scatter.filter(p => p.prediction === 'Suspicious');
                    const cheatPoints = data.charts.scatter.filter(p => p.prediction === 'Cheating');

                    scatterInstance.current = new Chart(ctx, {
                        type: 'scatter',
                        data: {
                            datasets: [
                                {
                                    label: 'Legitimate Human Cluster',
                                    data: legitPoints.map(p => ({ x: p.x, y: p.y })),
                                    backgroundColor: 'rgba(16, 185, 129, 0.75)',
                                    borderColor: '#10b981',
                                    pointRadius: 6,
                                    pointHoverRadius: 9
                                },
                                {
                                    label: 'Suspicious Anomalies Cluster',
                                    data: suspiciousPoints.map(p => ({ x: p.x, y: p.y })),
                                    backgroundColor: 'rgba(245, 158, 11, 0.85)',
                                    borderColor: '#f59e0b',
                                    pointRadius: 7,
                                    pointHoverRadius: 10
                                },
                                {
                                    label: 'Cheating / Superhuman Cluster',
                                    data: cheatPoints.map(p => ({ x: p.x, y: p.y })),
                                    backgroundColor: 'rgba(239, 68, 68, 0.9)',
                                    borderColor: '#ef4444',
                                    pointRadius: 8,
                                    pointHoverRadius: 11
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    title: { display: true, text: 'Weapon Accuracy (%)', color: '#94a3b8' },
                                    grid: { color: 'rgba(255,255,255,0.05)' },
                                    ticks: { color: '#94a3b8' }
                                },
                                y: {
                                    title: { display: true, text: 'Reaction Time (ms)', color: '#94a3b8' },
                                    grid: { color: 'rgba(255,255,255,0.05)' },
                                    ticks: { color: '#94a3b8' }
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: { color: '#f1f5f9' }
                                }
                            }
                        }
                    });
                }

                // 4. Line Chart: Telemetry Trends over Recent Matches
                if (lineChartRef.current) {
                    if (lineInstance.current) lineInstance.current.destroy();
                    const ctx = lineChartRef.current.getContext('2d');
                    lineInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.charts.line.labels,
                            datasets: [
                                {
                                    label: 'Accuracy (%)',
                                    data: data.charts.line.accuracy,
                                    borderColor: '#06b6d4',
                                    backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                    tension: 0.35,
                                    fill: true
                                },
                                {
                                    label: 'Headshot (%)',
                                    data: data.charts.line.headshot,
                                    borderColor: '#a855f7',
                                    backgroundColor: 'rgba(168, 85, 247, 0.1)',
                                    tension: 0.35,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    grid: { color: 'rgba(255,255,255,0.05)' },
                                    ticks: { color: '#94a3b8' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#94a3b8' }
                                }
                            },
                            plugins: {
                                legend: { labels: { color: '#f1f5f9' } }
                            }
                        }
                    });
                }
            }, [data]);

            const triggerDemoMatch = async () => {
                try {
                    const res = await fetch('/api/demo/seed-match', { method: 'POST' });
                    const resJson = await res.json();
                    if (resJson.status === 'success') {
                        showToast('Simulated 5-player competitive match & updated all charts!', 'success');
                        fetchDashboardData();
                    }
                } catch (e) {
                    showToast('Simulation error', 'error');
                }
            };

            if (loading && !data) {
                return (
                    <div className="py-20 text-center">
                        <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                        <p className="text-slate-400 font-mono text-sm">Aggregating Random Forest Telemetry Graphs...</p>
                    </div>
                );
            }

            const filteredRecords = data.records.filter(r => {
                if (filterType === 'all') return true;
                if (filterType === 'legitimate') return r.prediction === 'Legitimate';
                if (filterType === 'suspicious') return r.prediction === 'Suspicious';
                if (filterType === 'cheating') return r.prediction === 'Cheating';
                return true;
            });

            return (
                <div className="space-y-8">
                    {/* Header Controls */}
                    <div className="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <span className="px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-[10px] font-mono font-semibold uppercase">
                                    Flowchart Stages H & I
                                </span>
                            </div>
                            <h2 className="text-3xl font-black text-white tracking-tight">Live Detection Dashboard</h2>
                            <p className="text-xs text-slate-400 mt-1">
                                Real-time behavioral telemetry analyzed by the Random Forest classifier into 3 classifications.
                            </p>
                        </div>
                        <div className="flex items-center gap-3">
                            <button
                                onClick={triggerDemoMatch}
                                className="px-4 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white font-semibold text-xs shadow-md transition flex items-center gap-2"
                            >
                                <i className="fa-solid fa-bolt"></i>
                                <span>Simulate 5-Player Match</span>
                            </button>
                            <button
                                onClick={fetchDashboardData}
                                className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition"
                            >
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </div>

                    {/* KPI Statistics Grid (5 Metrics including 3-Tier Classification) */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div className="bg-[#0f172a] border border-indigo-950/80 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="text-xs font-mono uppercase text-slate-400 font-semibold">Total Evaluated</div>
                            <div className="text-3xl font-black text-white font-mono mt-2">{data.kpi.total_players}</div>
                            <div className="text-[11px] text-slate-500 mt-1">Across all match sessions</div>
                            <i className="fa-solid fa-users absolute right-4 bottom-4 text-4xl text-slate-800/40 pointer-events-none"></i>
                        </div>

                        <div className="bg-[#0f172a] border border-emerald-950/60 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="text-xs font-mono uppercase text-emerald-400 font-semibold">Legitimate Players</div>
                            <div className="text-3xl font-black text-emerald-400 font-mono mt-2">{data.kpi.legitimate_players}</div>
                            <div className="text-[11px] text-slate-500 mt-1">Normal human physiology verified</div>
                            <i className="fa-solid fa-shield-check absolute right-4 bottom-4 text-4xl text-emerald-950/40 pointer-events-none"></i>
                        </div>

                        <div className="bg-[#0f172a] border border-amber-950/60 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="text-xs font-mono uppercase text-amber-400 font-semibold">Suspicious / Anomalous</div>
                            <div className="text-3xl font-black text-amber-400 font-mono mt-2">{data.kpi.suspicious_players}</div>
                            <div className="text-[11px] text-slate-500 mt-1">Queued for moderator audit</div>
                            <i className="fa-solid fa-triangle-exclamation absolute right-4 bottom-4 text-4xl text-amber-950/40 pointer-events-none"></i>
                        </div>

                        <div className="bg-[#0f172a] border border-red-950/60 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="text-xs font-mono uppercase text-red-400 font-semibold">Cheating / High Risk</div>
                            <div className="text-3xl font-black text-red-400 font-mono mt-2">{data.kpi.cheating_players || 0}</div>
                            <div className="text-[11px] text-slate-500 mt-1">Blatant cheat signature detected</div>
                            <i className="fa-solid fa-ban absolute right-4 bottom-4 text-4xl text-red-950/40 pointer-events-none"></i>
                        </div>

                        <div className="bg-[#0f172a] border border-cyan-950/60 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="text-xs font-mono uppercase text-cyan-400 font-semibold">Avg Cheat Probability</div>
                            <div className="text-3xl font-black text-cyan-400 font-mono mt-2">{data.kpi.avg_cheat_probability}%</div>
                            <div className="text-[11px] text-slate-500 mt-1">Random Forest probability mean</div>
                            <i className="fa-solid fa-gauge-high absolute right-4 bottom-4 text-4xl text-cyan-950/40 pointer-events-none"></i>
                        </div>
                    </div>

                    {/* 4 Interactive Graphs Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* 1. Bar Chart: Cheat Probability per Player */}
                        <div className="bg-[#0f172a] border border-indigo-950/80 p-6 rounded-3xl shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="font-bold text-white text-base">Player-Wise Cheat Probability</h3>
                                    <p className="text-xs text-slate-400">Random Forest posterior probability per player</p>
                                </div>
                                <span className="px-2.5 py-1 rounded bg-slate-800 text-[11px] font-mono text-indigo-400">Bar Chart</span>
                            </div>
                            <div className="h-64">
                                <canvas ref={barChartRef}></canvas>
                            </div>
                        </div>

                        {/* 2. Doughnut / Pie Chart: 3-Tier Classification Ratio */}
                        <div className="bg-[#0f172a] border border-indigo-950/80 p-6 rounded-3xl shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="font-bold text-white text-base">3-Tier Classification Ratio</h3>
                                    <p className="text-xs text-slate-400">Legitimate vs Suspicious vs Cheating distribution</p>
                                </div>
                                <span className="px-2.5 py-1 rounded bg-slate-800 text-[11px] font-mono text-purple-400">Doughnut Chart</span>
                            </div>
                            <div className="h-64 flex items-center justify-center">
                                <canvas ref={pieChartRef}></canvas>
                            </div>
                        </div>

                        {/* 3. Scatter Plot: Accuracy vs Reaction Time */}
                        <div className="bg-[#0f172a] border border-indigo-950/80 p-6 rounded-3xl shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="font-bold text-white text-base">Accuracy vs. Reaction Time Clusters</h3>
                                    <p className="text-xs text-slate-400">Clusters human limits vs bot triggerbots & aimbots</p>
                                </div>
                                <span className="px-2.5 py-1 rounded bg-slate-800 text-[11px] font-mono text-cyan-400">Scatter Plot</span>
                            </div>
                            <div className="h-64">
                                <canvas ref={scatterChartRef}></canvas>
                            </div>
                        </div>

                        {/* 4. Line Chart: Telemetry Trends */}
                        <div className="bg-[#0f172a] border border-indigo-950/80 p-6 rounded-3xl shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="font-bold text-white text-base">Telemetry Trajectory Over Matches</h3>
                                    <p className="text-xs text-slate-400">Tracking accuracy and headshot percentages</p>
                                </div>
                                <span className="px-2.5 py-1 rounded bg-slate-800 text-[11px] font-mono text-emerald-400">Line Chart</span>
                            </div>
                            <div className="h-64">
                                <canvas ref={lineChartRef}></canvas>
                            </div>
                        </div>
                    </div>

                    {/* Detection Results Table with Filter Tabs */}
                    <div className="bg-[#0f172a] border border-indigo-950/80 rounded-3xl p-6 shadow-xl overflow-hidden">
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                            <div>
                                <h3 className="font-bold text-white text-lg">Detailed Telemetry & Classification Table</h3>
                                <p className="text-xs text-slate-400">Live per-player evaluation with Random Forest scores and anomaly flags</p>
                            </div>

                            {/* Classification Filter Tabs */}
                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={() => setFilterType('all')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterType === 'all'
                                            ? 'bg-indigo-600 text-white shadow'
                                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    All ({data.records.length})
                                </button>
                                <button
                                    onClick={() => setFilterType('legitimate')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterType === 'legitimate'
                                            ? 'bg-emerald-600 text-white shadow'
                                            : 'bg-slate-900 text-emerald-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Legitimate ({data.kpi.legitimate_players})
                                </button>
                                <button
                                    onClick={() => setFilterType('suspicious')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterType === 'suspicious'
                                            ? 'bg-amber-600 text-white shadow'
                                            : 'bg-slate-900 text-amber-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Suspicious ({data.kpi.suspicious_players})
                                </button>
                                <button
                                    onClick={() => setFilterType('cheating')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterType === 'cheating'
                                            ? 'bg-red-600 text-white shadow'
                                            : 'bg-slate-900 text-red-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Cheating ({data.kpi.cheating_players || 0})
                                </button>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr className="border-b border-slate-800 text-slate-400 font-mono uppercase text-[11px]">
                                        <th className="py-3 px-3">Player</th>
                                        <th className="py-3 px-3">Type</th>
                                        <th className="py-3 px-3">K / D</th>
                                        <th className="py-3 px-3">Accuracy</th>
                                        <th className="py-3 px-3">Headshot</th>
                                        <th className="py-3 px-3">Reaction</th>
                                        <th className="py-3 px-3">Speed</th>
                                        <th className="py-3 px-3">Cheat Prob</th>
                                        <th className="py-3 px-3">Classification</th>
                                        <th className="py-3 px-3">Moderator Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60 font-sans">
                                    {filteredRecords.length === 0 ? (
                                        <tr>
                                            <td colSpan="10" className="py-8 text-center text-slate-500 font-mono">
                                                No records found for filter: {filterType}. Run a match in the Lobby!
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredRecords.map((r, i) => (
                                            <tr key={i} className="hover:bg-slate-900/60 transition">
                                                <td className="py-3.5 px-3 font-semibold text-white flex items-center gap-2">
                                                    <div 
                                                        className="w-6 h-6 rounded-md flex items-center justify-center font-bold text-[10px] text-white"
                                                        style={{ backgroundColor: r.avatar_color || '#6366f1' }}
                                                    >
                                                        {r.username.substring(0, 2).toUpperCase()}
                                                    </div>
                                                    <span>{r.username}</span>
                                                </td>
                                                <td className="py-3.5 px-3">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-mono ${
                                                        r.is_simulated === 0 ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' : 'bg-slate-800 text-slate-400'
                                                    }`}>
                                                        {r.is_simulated === 0 ? 'Real Live' : 'Simulated'}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-3 font-mono">{r.kills} / {r.deaths} (KDR: {r.kdr})</td>
                                                <td className="py-3.5 px-3 font-mono">{r.accuracy_pct}%</td>
                                                <td className="py-3.5 px-3 font-mono">{r.headshot_pct}%</td>
                                                <td className="py-3.5 px-3 font-mono">{r.reaction_time_ms} ms</td>
                                                <td className="py-3.5 px-3 font-mono">{r.movement_speed} m/s</td>
                                                <td className="py-3.5 px-3 font-mono font-bold">
                                                    <span className={r.cheat_probability >= 70 ? 'text-red-400' : r.cheat_probability >= 35 ? 'text-amber-400' : 'text-emerald-400'}>
                                                        {r.cheat_probability}%
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-3">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase inline-flex items-center gap-1.5 ${
                                                        r.prediction === 'Cheating' 
                                                            ? 'bg-red-950/80 text-red-400 border border-red-800/80 shadow-[0_0_8px_rgba(239,68,68,0.3)]' 
                                                            : r.prediction === 'Suspicious'
                                                            ? 'bg-amber-950/80 text-amber-400 border border-amber-800/80 shadow-[0_0_8px_rgba(245,158,11,0.25)]'
                                                            : 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/80 shadow-[0_0_8px_rgba(16,185,129,0.2)]'
                                                    }`}>
                                                        <i className={`fa-solid ${
                                                            r.prediction === 'Cheating' ? 'fa-ban' :
                                                            r.prediction === 'Suspicious' ? 'fa-triangle-exclamation' : 'fa-circle-check'
                                                        } text-[9px]`}></i>
                                                        {r.prediction}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-3 text-slate-400 font-mono text-[11px]">
                                                    {r.moderator_decision === 'Confirmed Cheating' ? (
                                                        <span className="text-red-400 font-bold"><i className="fa-solid fa-ban mr-1"></i> Confirmed</span>
                                                    ) : r.moderator_decision === 'Legitimate' ? (
                                                        <span className="text-emerald-400 font-bold"><i className="fa-solid fa-check mr-1"></i> Cleared</span>
                                                    ) : (
                                                        <span className="text-amber-400"><i className="fa-solid fa-clock mr-1"></i> Under Review</span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // =========================================================
        // MODULE 6: MODERATOR DASHBOARD & HUMAN-IN-THE-LOOP AUDIT
        // Stage J of the Flowchart: Forensic Human Review
        // =========================================================
        function ModeratorView({ currentUser, showToast }) {
            const [queue, setQueue] = useState([]);
            const [stats, setStats] = useState(null);
            const [selectedCase, setSelectedCase] = useState(null);
            const [decision, setDecision] = useState('Needs Further Review');
            const [actionTaken, setActionTaken] = useState('Under Observation');
            const [notes, setNotes] = useState('');
            const [submitting, setSubmitting] = useState(false);
            const [filterCategory, setFilterCategory] = useState('all');

            const fetchQueue = async () => {
                try {
                    const res = await fetch('/api/moderator/queue');
                    const data = await res.json();
                    if (data.status === 'success') {
                        setQueue(data.queue);
                        setStats(data.stats);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                fetchQueue();
            }, []);

            const openReviewModal = (item) => {
                setSelectedCase(item);
                setDecision(item.decision || 'Needs Further Review');
                setActionTaken(item.action_taken || 'Under Observation');
                setNotes(item.notes || '');
            };

            const handleSubmitReview = async (e) => {
                e.preventDefault();
                if (!currentUser) {
                    showToast('Please sign in as a moderator.', 'warning');
                    return;
                }
                setSubmitting(true);
                try {
                    const res = await fetch('/api/moderator/review', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            detection_id: selectedCase.detection_id,
                            decision: decision,
                            notes: notes,
                            action_taken: actionTaken
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        showToast(data.message, 'success');
                        setSelectedCase(null);
                        fetchQueue();
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (err) {
                    showToast('Failed to save review', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            const filteredQueue = queue.filter(item => {
                if (filterCategory === 'all') return true;
                if (filterCategory === 'cheating') return item.prediction === 'Cheating';
                if (filterCategory === 'suspicious') return item.prediction === 'Suspicious';
                if (filterCategory === 'pending') return item.decision === 'Under Review' || item.decision === 'Needs Further Review';
                if (filterCategory === 'resolved') return item.decision === 'Confirmed Cheating' || item.decision === 'Legitimate';
                return true;
            });

            return (
                <div className="space-y-8">
                    {/* Header Notice */}
                    <div className="p-6 rounded-3xl bg-gradient-to-r from-purple-950/60 to-indigo-950/60 border border-purple-500/30 shadow-xl">
                        <div className="flex items-center gap-2 mb-2">
                            <span className="px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-mono font-semibold uppercase">
                                Flowchart Stage J: Human-in-the-Loop Audit
                            </span>
                        </div>
                        <div className="flex items-center gap-3 mb-2">
                            <span className="w-9 h-9 rounded-xl bg-purple-600/30 flex items-center justify-center text-purple-400">
                                <i className="fa-solid fa-gavel"></i>
                            </span>
                            <h2 className="text-2xl font-black text-white">Forensic Moderator Review Center</h2>
                        </div>
                        <p className="text-xs text-slate-300 max-w-2xl leading-relaxed">
                            <strong className="text-purple-300">Human-in-the-Loop Protocol:</strong> Machine Learning classification stratifies players into <span className="text-emerald-400">Legitimate</span>, <span className="text-amber-400">Suspicious</span>, and <span className="text-red-400">Cheating</span>. However, the system <strong>never executes automated bans</strong> solely on ML confidence. Human moderators inspect kinematic anomalies and issue binding verdicts.
                        </p>
                    </div>

                    {/* Stats Ribbon */}
                    {stats && (
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-slate-800 text-center">
                                <div className="text-xs font-mono text-slate-400">Total Flagged</div>
                                <div className="text-2xl font-black text-white font-mono mt-1">{stats.total_flagged}</div>
                            </div>
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-amber-950 text-center">
                                <div className="text-xs font-mono text-amber-400">Pending Review</div>
                                <div className="text-2xl font-black text-amber-400 font-mono mt-1">{stats.pending_review}</div>
                            </div>
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-red-950 text-center">
                                <div className="text-xs font-mono text-red-400">Confirmed Cheaters</div>
                                <div className="text-2xl font-black text-red-400 font-mono mt-1">{stats.confirmed_cheating}</div>
                            </div>
                            <div className="p-4 bg-[#0f172a] rounded-2xl border border-emerald-950 text-center">
                                <div className="text-xs font-mono text-emerald-400">Cleared Legitimate</div>
                                <div className="text-2xl font-black text-emerald-400 font-mono mt-1">{stats.cleared_legitimate}</div>
                            </div>
                        </div>
                    )}

                    {/* Audit Queue Table with Filter Tabs */}
                    <div className="bg-[#0f172a] border border-indigo-950/80 rounded-3xl p-6 shadow-xl">
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
                            <div>
                                <h3 className="font-bold text-white text-base">Suspicious & Cheating Telemetry Queue</h3>
                                <p className="text-xs text-slate-400">Human audit queue for players flagged by Random Forest model</p>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={() => setFilterCategory('all')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterCategory === 'all'
                                            ? 'bg-purple-600 text-white shadow'
                                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    All ({queue.length})
                                </button>
                                <button
                                    onClick={() => setFilterCategory('cheating')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterCategory === 'cheating'
                                            ? 'bg-red-600 text-white shadow'
                                            : 'bg-slate-900 text-red-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Cheating Flags
                                </button>
                                <button
                                    onClick={() => setFilterCategory('suspicious')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterCategory === 'suspicious'
                                            ? 'bg-amber-600 text-white shadow'
                                            : 'bg-slate-900 text-amber-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Suspicious Flags
                                </button>
                                <button
                                    onClick={() => setFilterCategory('pending')}
                                    className={`px-3 py-1 rounded-xl text-xs font-semibold transition ${
                                        filterCategory === 'pending'
                                            ? 'bg-cyan-600 text-white shadow'
                                            : 'bg-slate-900 text-cyan-400 hover:text-white border border-slate-800'
                                    }`}
                                >
                                    Pending Audit
                                </button>
                            </div>
                        </div>

                        {filteredQueue.length === 0 ? (
                            <div className="text-center py-12 text-slate-500 font-mono text-xs">
                                No records matching filter: {filterCategory}. Run a match in the Lobby!
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-slate-400 font-mono uppercase text-[11px]">
                                            <th className="py-3 px-3">Player</th>
                                            <th className="py-3 px-3">ML Class</th>
                                            <th className="py-3 px-3">Probability</th>
                                            <th className="py-3 px-3">Accuracy</th>
                                            <th className="py-3 px-3">Headshots</th>
                                            <th className="py-3 px-3">Reaction Time</th>
                                            <th className="py-3 px-3">Detected Anomalies</th>
                                            <th className="py-3 px-3">Moderator Verdict</th>
                                            <th className="py-3 px-3">Audit Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/60 font-sans">
                                        {filteredQueue.map(item => (
                                            <tr key={item.detection_id} className="hover:bg-slate-900/60 transition">
                                                <td className="py-3.5 px-3 font-semibold text-white">
                                                    {item.username}
                                                </td>
                                                <td className="py-3.5 px-3">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-mono uppercase font-bold ${
                                                        item.prediction === 'Cheating' ? 'bg-red-950 text-red-400 border border-red-800' :
                                                        item.prediction === 'Suspicious' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                                        'bg-emerald-950 text-emerald-400 border border-emerald-800'
                                                    }`}>
                                                        {item.prediction}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-3 font-mono font-bold text-red-400">
                                                    {item.cheat_probability}%
                                                </td>
                                                <td className="py-3.5 px-3 font-mono">{item.accuracy_pct}%</td>
                                                <td className="py-3.5 px-3 font-mono">{item.headshot_pct}%</td>
                                                <td className="py-3.5 px-3 font-mono">{item.reaction_time_ms} ms</td>
                                                <td className="py-3.5 px-3 max-w-xs truncate text-amber-300/90 font-mono text-[10px]">
                                                    {item.anomaly_flags}
                                                </td>
                                                <td className="py-3.5 px-3">
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${
                                                        item.decision === 'Confirmed Cheating' ? 'bg-red-950 text-red-400 border border-red-800' :
                                                        item.decision === 'Legitimate' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                                        'bg-amber-950 text-amber-400 border border-amber-800'
                                                    }`}>
                                                        {item.decision}
                                                    </span>
                                                </td>
                                                <td className="py-3.5 px-3">
                                                    <button
                                                        onClick={() => openReviewModal(item)}
                                                        className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow transition flex items-center gap-1.5"
                                                    >
                                                        <i className="fa-solid fa-magnifying-glass text-[10px]"></i>
                                                        <span>Investigate</span>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Forensic Investigation Modal */}
                    {selectedCase && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="bg-[#0f172a] border border-indigo-500/40 w-full max-w-2xl rounded-3xl p-6 lg:p-8 shadow-2xl relative cyber-glow">
                                <button 
                                    onClick={() => setSelectedCase(null)}
                                    className="absolute top-6 right-6 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="mb-6">
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="px-2.5 py-0.5 rounded bg-red-950 text-red-400 border border-red-800 font-mono text-xs font-bold uppercase">
                                            Case #DET-{selectedCase.detection_id}
                                        </span>
                                    </div>
                                    <h3 className="text-2xl font-black text-white">
                                        Forensic Investigation: {selectedCase.username}
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-0.5">
                                        Evaluated by Random Forest Classifier • Model Risk: <strong className="text-red-400">{selectedCase.cheat_probability}%</strong>
                                    </p>
                                </div>

                                {/* Telemetry Breakdown Box */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 p-4 bg-slate-900 rounded-2xl border border-slate-800 mb-6 font-mono text-xs">
                                    <div>
                                        <span className="text-slate-500">Accuracy</span>
                                        <div className="text-base font-bold text-white">{selectedCase.accuracy_pct}%</div>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Headshot %</span>
                                        <div className="text-base font-bold text-white">{selectedCase.headshot_pct}%</div>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Reaction Time</span>
                                        <div className="text-base font-bold text-white">{selectedCase.reaction_time_ms} ms</div>
                                    </div>
                                    <div>
                                        <span className="text-slate-500">Actions / Sec</span>
                                        <div className="text-base font-bold text-white">{selectedCase.actions_per_second}</div>
                                    </div>
                                </div>

                                {/* Anomaly Indicators */}
                                <div className="mb-6 p-4 rounded-xl bg-amber-950/20 border border-amber-900/40">
                                    <div className="text-xs font-bold text-amber-300 font-mono mb-1.5 flex items-center gap-1.5">
                                        <i className="fa-solid fa-triangle-exclamation"></i> Identified Behavioral Anomalies:
                                    </div>
                                    <p className="text-xs text-slate-300 leading-relaxed font-sans">
                                        {selectedCase.anomaly_flags || 'No rule-based anomalies reported.'}
                                    </p>
                                </div>

                                {/* Review Determination Form */}
                                <form onSubmit={handleSubmitReview} className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-mono text-slate-400 mb-1.5">MODERATOR VERDICT</label>
                                            <select
                                                value={decision}
                                                onChange={e => setDecision(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                                            >
                                                <option value="Confirmed Cheating">🚫 Confirmed Cheating</option>
                                                <option value="Legitimate">✅ Legitimate (False Positive Cleared)</option>
                                                <option value="Needs Further Review">⏳ Needs Further Review</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-mono text-slate-400 mb-1.5">ACTION PROTOCOL</label>
                                            <select
                                                value={actionTaken}
                                                onChange={e => setActionTaken(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                                            >
                                                <option value="Under Observation">Under Observation</option>
                                                <option value="Warning Issued">Warning Issued</option>
                                                <option value="Account Suspended">Account Suspended</option>
                                                <option value="Cleared">Cleared</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-mono text-slate-400 mb-1.5">AUDIT EVIDENCE NOTES</label>
                                        <textarea
                                            value={notes}
                                            onChange={e => setNotes(e.target.value)}
                                            rows="3"
                                            placeholder="Enter justification: e.g. Crosshair snapping confirmed with 92% headshots under 75ms..."
                                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500"
                                        ></textarea>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setSelectedCase(null)}
                                            className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={submitting}
                                            className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white font-bold text-xs shadow-lg shadow-purple-600/30"
                                        >
                                            {submitting ? 'Submitting...' : 'Save Audit Determination'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // =========================================================
        // MODULE 4/8: MACHINE LEARNING MODEL ANALYTICS & BENCHMARK
        // =========================================================
        function ModelAnalyticsView({ showToast }) {
            const [modelInfo, setModelInfo] = useState(null);

            useEffect(() => {
                fetch('/api/model/info')
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            setModelInfo(data.metadata);
                        }
                    })
                    .catch(err => console.error(err));
            }, []);

            if (!modelInfo) {
                return (
                    <div className="py-20 text-center text-slate-400 font-mono text-sm">
                        Loading Random Forest Metadata...
                    </div>
                );
            }

            return (
                <div className="space-y-8">
                    {/* Header */}
                    <div className="p-8 rounded-3xl bg-gradient-to-r from-indigo-950/70 via-purple-950/50 to-slate-900 border border-indigo-500/20 shadow-2xl">
                        <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-mono font-semibold uppercase">
                            Scikit-Learn Random Forest Pipeline
                        </span>
                        <h2 className="text-3xl font-black text-white mt-3">Machine Learning Architecture</h2>
                        <p className="text-xs text-slate-400 mt-1 max-w-xl">
                            Trained with 100 decision trees to separate genuine human biomechanical reflex distributions from synthetic software aim modifications.
                        </p>
                    </div>

                    {/* Benchmark Metrics Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
                        <div className="p-5 bg-[#0f172a] rounded-2xl border border-slate-800 text-center">
                            <span className="text-xs font-mono text-slate-400">Accuracy</span>
                            <div className="text-3xl font-black text-emerald-400 font-mono mt-1">{(modelInfo.metrics.accuracy * 100).toFixed(2)}%</div>
                        </div>
                        <div className="p-5 bg-[#0f172a] rounded-2xl border border-slate-800 text-center">
                            <span className="text-xs font-mono text-slate-400">Precision</span>
                            <div className="text-3xl font-black text-cyan-400 font-mono mt-1">{(modelInfo.metrics.precision * 100).toFixed(2)}%</div>
                        </div>
                        <div className="p-5 bg-[#0f172a] rounded-2xl border border-slate-800 text-center">
                            <span className="text-xs font-mono text-slate-400">Recall</span>
                            <div className="text-3xl font-black text-purple-400 font-mono mt-1">{(modelInfo.metrics.recall * 100).toFixed(2)}%</div>
                        </div>
                        <div className="p-5 bg-[#0f172a] rounded-2xl border border-slate-800 text-center">
                            <span className="text-xs font-mono text-slate-400">F1-Score</span>
                            <div className="text-3xl font-black text-indigo-400 font-mono mt-1">{(modelInfo.metrics.f1_score * 100).toFixed(2)}%</div>
                        </div>
                        <div className="p-5 bg-[#0f172a] rounded-2xl border border-slate-800 text-center col-span-2 sm:col-span-1">
                            <span className="text-xs font-mono text-slate-400">ROC-AUC</span>
                            <div className="text-3xl font-black text-amber-400 font-mono mt-1">{modelInfo.metrics.roc_auc.toFixed(4)}</div>
                        </div>
                    </div>

                    {/* Feature Importance Table */}
                    <div className="bg-[#0f172a] border border-indigo-950/80 rounded-3xl p-6 lg:p-8 shadow-xl">
                        <h3 className="font-bold text-white text-lg mb-4">Random Forest Feature Importances</h3>
                        <div className="space-y-4">
                            {modelInfo.feature_importances.map(item => (
                                <div key={item.feature}>
                                    <div className="flex justify-between text-xs font-mono mb-1">
                                        <span className="text-slate-300 font-semibold">{item.feature}</span>
                                        <span className="text-indigo-400 font-bold">{(item.importance * 100).toFixed(2)}%</span>
                                    </div>
                                    <div className="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-800">
                                        <div 
                                            className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-500"
                                            style={{ width: `${Math.max(5, item.importance * 100)}%` }}
                                        ></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Render React Application
        ReactDOM.render(<App />, document.getElementById('root'));
    {% endraw %}
    </script>
</body>
</html>
